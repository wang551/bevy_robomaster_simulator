[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.dependencies]
bevy = { version = "0.19", features = ["dynamic_linking", "jpeg"] }
avian3d = "0.7"
bevy-inspector-egui = "0.37"
memmap2 = { version = "0" }

[package]
name = "daedalus"
version = "0.1.0"
edition = "2024"
default-run = "daedalus"

[features]
ros2 = ["dep:r2r"]
talos = ["dep:talos-ipc"]
ffmpeg = ["dep:ffmpeg-next"]
default = ["talos"]

[dependencies]
bevy = { workspace = true }
avian3d = { workspace = true }
bevy-inspector-egui = { workspace = true }
rand = "0.10"
r2r = { version = "0", optional = true }
talos-ipc = { path = "crates/talos-ipc", optional = true }
crossbeam-channel = "0"
image = "0"
egui = "0"
futures = "0"
exact = { path = "crates/exact" }
bevy_metalfx = { path = "crates/bevy_metalfx" }
toml = "1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
ffmpeg-next = { version = "8.1.0", optional = true }

[[bin]]
name = "talos_gimbal_mock_server"
path = "src/bin/talos_gimbal_mock_server.rs"
required-features = ["talos", "ffmpeg"]

[[bin]]
name = "talos_gimbal_cmd_pub"
path = "src/bin/talos_gimbal_cmd_pub.rs"
required-features = ["talos"]

[patch.crates-io]
# r2r 0.9.5 (latest on crates.io) cannot compile against ROS2 lyrical/rolling
# headers (rcl_timer_init removed, RMW_QOS_POLICY_LIVELINESS_MANUAL_BY_NODE
# removed). 0.9.6 fixes both but was never published to crates.io, so pin the
# git tag instead. r2r_rcl/r2r_common are patched too so the vendored
# r2r_msg_gen's version-only deps resolve to the same git source.
r2r = { git = "https://github.com/sequenceplanner/r2r", tag = "0.9.6" }
r2r_rcl = { git = "https://github.com/sequenceplanner/r2r", tag = "0.9.6" }
r2r_common = { git = "https://github.com/sequenceplanner/r2r", tag = "0.9.6" }

# The vendored r2r_msg_gen (0.9.6 + local patch) replaces the git checkout's
# copy: on rolling/lyrical bindgen emits an opaque rosidl_message_type_support_t
# (no `data` field), so introspection must go through a manually declared
# MessageTypeSupportView layout.
[patch."https://github.com/sequenceplanner/r2r"]
r2r_msg_gen = { path = "third_party/r2r_msg_gen" }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
